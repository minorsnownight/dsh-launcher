[package]
name = "dsh-launcher"
version = "0.1.1"
description = "A calm desktop home for DeepSeek Harness"
authors = ["minorsnownight <minorsnownight@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/minorsnownight/dsh-launcher"

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
tokio = { version = "1", features = ["time", "process"] }
rfd = "0.15"
