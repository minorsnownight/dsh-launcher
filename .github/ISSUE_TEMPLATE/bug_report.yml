name: Bug report
description: Report reproducible incorrect behavior in DSH Launcher
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve DSH Launcher. Do not include secrets or private project files.
  - type: input
    id: version
    attributes:
      label: DSH Launcher version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: Leave blank if DSH Launcher cannot detect it.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Tell us exactly what you did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or sanitized logs if they help. Remove credentials and private paths first.
